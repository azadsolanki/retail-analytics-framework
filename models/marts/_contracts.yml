# Core Models Schema with Contracts
# Contracts enforce column names and data types for downstream consumers
# Breaking changes will fail in CI before reaching production

version: 2

models:
  - name: dim_users
    description: Customer dimension with demographics, segmentation, and lifetime metrics
    config:
      contract:
        enforced: true
    columns:
      - name: user_id
        description: Primary key - unique customer identifier
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: full_name
        data_type: string
      - name: email
        data_type: string
      - name: age
        data_type: int64
      - name: age_group
        data_type: string
      - name: generation
        data_type: string
      - name: gender
        data_type: string
      - name: state
        data_type: string
      - name: country
        data_type: string
      - name: region
        data_type: string
      - name: is_domestic
        data_type: boolean
      - name: latitude
        data_type: float64
      - name: longitude
        data_type: float64
      - name: traffic_source
        data_type: string
      - name: acquisition_channel
        data_type: string
      - name: registration_date
        data_type: timestamp
      - name: total_orders
        data_type: int64
      - name: completed_orders
        data_type: int64
      - name: cancelled_orders
        data_type: int64
      - name: lifetime_value
        data_type: float64

  - name: dim_products
    description: Product dimension with catalog info and performance metrics
    config:
      contract:
        enforced: true
    columns:
      - name: product_id
        description: Primary key - unique product identifier
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
      - name: product_name
        data_type: string
      - name: category
        data_type: string
      - name: category_group
        data_type: string
      - name: brand
        data_type: string
      - name: brand_tier
        data_type: string
      - name: department
        data_type: string
      - name: sku
        data_type: string
      - name: product_cost
        data_type: float64
      - name: retail_price
        data_type: float64
      - name: margin_amount
        data_type: float64
      - name: margin_percentage
        data_type: float64
      - name: margin_tier
        data_type: string
      - name: price_category
        data_type: string
      - name: distribution_center_id
        data_type: int64
      - name: total_units_sold
        data_type: int64
      - name: total_orders
        data_type: int64
      - name: unique_customers
        data_type: int64
      - name: total_revenue
        data_type: float64
      - name: total_gross_profit
        data_type: float64
      - name: avg_selling_price
        data_type: float64
      - name: avg_gross_margin_pct
        data_type: float64
      - name: units_returned
        data_type: int64
      - name: total_returned_revenue
        data_type: float64
      - name: return_rate
        data_type: float64
      - name: first_sale_date
        data_type: timestamp
      - name: last_sale_date
        data_type: timestamp
      - name: active_sales_days
        data_type: int64

  - name: fct_orders
    description: Order fact table with transaction details and metrics
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        description: Primary key - unique order identifier
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: user_id
        description: Foreign key to dim_users
        data_type: int64
        constraints:
          - type: not_null
        tests:
          - relationships:
              to: ref('dim_users')
              field: user_id
              config:
                severity: warn
      - name: order_date
        data_type: timestamp
        constraints:
          - type: not_null
      - name: order_status
        data_type: string
      - name: customer_gender
        data_type: string
      - name: order_time_of_day
        data_type: string
      - name: order_day_name
        data_type: string
      - name: order_hour
        data_type: int64
      - name: order_month
        data_type: int64
      - name: order_quarter
        data_type: int64
      - name: order_year
        data_type: int64
      - name: is_weekend
        data_type: boolean
      - name: item_count
        data_type: int64
      - name: order_has_returns
        data_type: boolean
      - name: is_delivered
        data_type: boolean
      - name: is_complete
        data_type: boolean
      - name: delivery_days
        data_type: int64
      - name: order_total
        data_type: float64
      - name: total_gross_profit
        data_type: float64
      - name: avg_gross_margin_pct
        data_type: float64
      - name: returned_amount
        data_type: float64
      - name: net_order_total
        data_type: float64
      - name: unique_products
        data_type: int64
      - name: unique_categories
        data_type: int64
      - name: unique_brands
        data_type: int64
      - name: total_line_items
        data_type: int64
      - name: avg_item_price
        data_type: float64
      - name: max_item_price
        data_type: float64
      - name: min_item_price
        data_type: float64
      - name: customer_age
        data_type: int64
      - name: customer_age_group
        data_type: string
      - name: customer_generation
        data_type: string
      - name: customer_state
        data_type: string
      - name: customer_country
        data_type: string
      - name: customer_region
        data_type: string
      - name: is_domestic_customer
        data_type: boolean
      - name: customer_acquisition_channel
        data_type: string
