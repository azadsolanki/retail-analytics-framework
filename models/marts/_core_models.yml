version: 2

models:
  - name: dim_users
    description: "Customer dimension with comprehensive behavioral and demographic attributes"
    access: public
    group: analytics_engineering
    latest_version: 1
    versions:
      - v: 1
    columns:
      - name: user_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address"
        tests:
          - unique:
              config:
                severity: warn
      - name: lifetime_value
        description: "Total customer spending"
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension with sales performance metrics"
    access: public
    group: analytics_engineering
    latest_version: 1
    versions:
      - v: 1
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name"
        tests:
          - not_null

  - name: fct_orders
    description: "Order fact table with comprehensive metrics"
    access: public
    group: analytics_engineering
    latest_version: 1
    versions:
      - v: 1
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Customer reference"
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
              config:
                severity: warn

  - name: fct_daily_revenue
    description: "Daily revenue aggregations"
    access: public
    group: analytics_engineering
    latest_version: 1
    versions:
      - v: 1
    columns:
      - name: revenue_date
        description: "Date of revenue"
        tests:
          - unique
          - not_null

  - name: rpt_product_performance
    description: "Product performance report"
    access: public
    group: analytics_engineering
    columns:
      - name: product_id
        description: "Product reference"
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
              config:
                severity: warn

  - name: rpt_customer_cohorts
    description: "Customer cohort analysis"
    access: public
    group: analytics_engineering
    columns:
      - name: cohort_month
        description: "Cohort month"
        tests:
          - not_null

  - name: rpt_executive_dashboard
    description: "Executive dashboard metrics"
    access: public
    group: analytics_engineering
    columns:
      - name: metric_month
        description: "Metric month"
        tests:
          - not_null
