version: 2

models:
  - name: dim_users
    description: "Customer dimension with comprehensive behavioral and demographic attributes"
    config:
      contract:
        enforced: true
    columns:
      # Core identifiers
      - name: user_id
        description: "Unique customer identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: full_name
        data_type: string
      - name: email
        description: "Customer email address"
        data_type: string
        tests:
          - unique:
              config:
                severity: warn
      # Demographics
      - name: age
        data_type: int64
      - name: age_group
        data_type: string
      - name: generation
        data_type: string
      - name: gender
        data_type: string
      # Location
      - name: state
        data_type: string
      - name: country
        data_type: string
      - name: region
        data_type: string
      - name: is_domestic
        data_type: boolean
      - name: latitude
        data_type: float64
      - name: longitude
        data_type: float64
      # Acquisition
      - name: traffic_source
        data_type: string
      - name: acquisition_channel
        data_type: string
      - name: registration_date
        data_type: timestamp
      # Order history metrics
      - name: total_orders
        data_type: int64
      - name: completed_orders
        data_type: int64
      - name: cancelled_orders
        data_type: int64
      - name: lifetime_value
        description: "Total customer spending"
        data_type: float64
        tests:
          - not_null
      - name: net_lifetime_value
        data_type: float64
      - name: lifetime_gross_profit
        data_type: float64
      - name: avg_order_value
        data_type: float64
      - name: avg_item_value
        data_type: float64
      # Timing metrics
      - name: first_order_date
        data_type: timestamp
      - name: last_order_date
        data_type: timestamp
      - name: days_since_last_order
        data_type: int64
      - name: customer_tenure_days
        data_type: int64
      - name: orders_per_month
        data_type: float64
      - name: orders_per_year
        data_type: float64
      # Product preferences
      - name: unique_products_purchased
        data_type: int64
      - name: unique_categories_purchased
        data_type: int64
      - name: unique_brands_purchased
        data_type: int64
      - name: preferred_category
        data_type: string
      - name: preferred_brand
        data_type: string
      - name: product_diversity_score
        data_type: float64
      # Behavioral patterns
      - name: return_rate
        data_type: float64
      - name: weekend_order_pct
        data_type: float64
      - name: premium_propensity_pct
        data_type: float64
      - name: avg_delivery_days
        data_type: float64
      - name: fast_delivery_pct
        data_type: float64
      # Customer segmentation
      - name: value_segment
        data_type: string
      - name: activity_segment
        data_type: string
      - name: frequency_segment
        data_type: string
      # RFM Score Components
      - name: recency_score
        data_type: int64
      - name: frequency_score
        data_type: int64
      - name: monetary_score
        data_type: int64
      # Metadata
      - name: dbt_updated_at
        data_type: timestamp

  - name: dim_products
    description: "Product dimension with sales performance metrics"
    config:
      contract:
        enforced: true
    columns:
      # Core identifiers
      - name: product_id
        description: "Unique product identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name"
        data_type: string
        tests:
          - not_null
      - name: category
        data_type: string
      - name: category_group
        data_type: string
      - name: brand
        data_type: string
      - name: brand_tier
        data_type: string
      - name: department
        data_type: string
      - name: sku
        data_type: string
      # Pricing
      - name: product_cost
        data_type: float64
      - name: retail_price
        data_type: float64
      - name: margin_amount
        data_type: float64
      - name: margin_percentage
        data_type: float64
      - name: margin_tier
        data_type: string
      - name: price_category
        data_type: string
      - name: distribution_center_id
        data_type: int64
      # Sales performance metrics
      - name: total_units_sold
        data_type: int64
      - name: total_orders
        data_type: int64
      - name: unique_customers
        data_type: int64
      - name: total_revenue
        data_type: float64
      - name: total_gross_profit
        data_type: float64
      - name: avg_selling_price
        data_type: float64
      - name: avg_gross_margin_pct
        data_type: float64
      # Return metrics
      - name: units_returned
        data_type: int64
      - name: total_returned_revenue
        data_type: float64
      - name: return_rate
        data_type: float64
      # Performance indicators
      - name: first_sale_date
        data_type: timestamp
      - name: last_sale_date
        data_type: timestamp
      - name: active_sales_days
        data_type: int64
      - name: revenue_90d
        data_type: float64
      - name: units_sold_90d
        data_type: int64
      - name: recent_performance_status
        data_type: string
      # Customer and geographic metrics
      - name: revenue_per_customer
        data_type: float64
      - name: avg_units_per_order
        data_type: float64
      - name: geographic_reach_score
        data_type: int64
      - name: customer_diversity_pct
        data_type: float64
      # Seasonality
      - name: q4_seasonality_index
        data_type: float64
      # Performance categorization
      - name: performance_tier
        data_type: string
      - name: inventory_status
        data_type: string
      - name: pricing_position
        data_type: string
      # Metadata
      - name: dbt_updated_at
        data_type: timestamp

  - name: fct_orders
    description: "Order fact table with comprehensive metrics"
    config:
      contract:
        enforced: true
    columns:
      # Core identifiers
      - name: order_id
        description: "Unique order identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Customer reference"
        data_type: int64
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
              config:
                severity: warn
      # Time dimensions
      - name: order_date
        data_type: timestamp
      - name: order_status
        data_type: string
      - name: customer_gender
        data_type: string
      - name: order_time_of_day
        data_type: string
      - name: order_day_name
        data_type: string
      - name: order_hour
        data_type: int64
      - name: order_month
        data_type: int64
      - name: order_quarter
        data_type: int64
      - name: order_year
        data_type: int64
      - name: is_weekend
        data_type: boolean
      - name: item_count
        data_type: int64
      - name: order_has_returns
        data_type: boolean
      - name: is_delivered
        data_type: boolean
      - name: is_complete
        data_type: boolean
      - name: delivery_days
        data_type: int64
      # Financial metrics
      - name: order_total
        data_type: float64
      - name: total_gross_profit
        data_type: float64
      - name: avg_gross_margin_pct
        data_type: float64
      - name: returned_amount
        data_type: float64
      - name: net_order_total
        data_type: float64
      # Product mix analysis
      - name: unique_products
        data_type: int64
      - name: unique_categories
        data_type: int64
      - name: unique_brands
        data_type: int64
      - name: total_line_items
        data_type: int64
      # Price analysis
      - name: avg_item_price
        data_type: float64
      - name: max_item_price
        data_type: float64
      - name: min_item_price
        data_type: float64
      - name: price_stddev
        data_type: float64
      # Category mix
      - name: apparel_items
        data_type: int64
      - name: footwear_items
        data_type: int64
      - name: accessories_items
        data_type: int64
      # Price tier mix
      - name: luxury_items
        data_type: int64
      - name: premium_items
        data_type: int64
      - name: budget_items
        data_type: int64
      # Customer demographics
      - name: customer_age
        data_type: int64
      - name: customer_age_group
        data_type: string
      - name: customer_generation
        data_type: string
      - name: customer_state
        data_type: string
      - name: customer_country
        data_type: string
      - name: customer_region
        data_type: string
      - name: is_domestic_customer
        data_type: boolean
      - name: customer_acquisition_channel
        data_type: string
      # Customer sequence
      - name: customer_order_number
        data_type: int64
      - name: customer_running_total
        data_type: float64
      - name: customer_running_orders
        data_type: int64
      - name: previous_order_date
        data_type: timestamp
      - name: days_since_previous_order
        data_type: int64
      - name: previous_order_value
        data_type: float64
      - name: customer_segment_at_order
        data_type: string
      # Order characteristics
      - name: is_first_order
        data_type: boolean
      - name: is_early_order
        data_type: boolean
      - name: order_size_category
        data_type: string
      # Product diversity metrics
      - name: product_diversity_ratio
        data_type: float64
      - name: category_diversity_ratio
        data_type: float64
      # Return analysis
      - name: return_rate_by_value
        data_type: float64
      - name: has_returns
        data_type: boolean
      # Value progression
      - name: value_trend
        data_type: string
      - name: repurchase_timing
        data_type: string
      - name: seasonal_period
        data_type: string
      # Metadata
      - name: dbt_updated_at
        data_type: timestamp

  - name: fct_daily_revenue
    description: "Daily revenue aggregations"
    columns:
      - name: revenue_date
        description: "Date of revenue"
        tests:
          - unique
          - not_null

  - name: rpt_product_performance
    description: "Product performance report"
    columns:
      - name: product_id
        description: "Product reference"
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
              config:
                severity: warn

  - name: rpt_customer_cohorts
    description: "Customer cohort analysis"
    columns:
      - name: cohort_month
        description: "Cohort month"
        tests:
          - not_null

  - name: rpt_executive_dashboard
    description: "Executive dashboard metrics"
    columns:
      - name: metric_month
        description: "Metric month"
        tests:
          - not_null
