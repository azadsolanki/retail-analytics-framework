version: 2

models:
  - name: dim_users
    description: "Customer dimension with comprehensive behavioral and demographic attributes"
    config:
      contract:
        enforced: true
    columns:
      - name: user_id
        description: "Unique customer identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: full_name
        data_type: string
      - name: email
        description: "Customer email address"
        data_type: string
        tests:
          - unique:
              config:
                severity: warn
      - name: age
        data_type: int64
      - name: age_group
        data_type: string
      - name: generation
        data_type: string
      - name: gender
        data_type: string
      - name: state
        data_type: string
      - name: country
        data_type: string
      - name: region
        data_type: string
      - name: is_domestic
        data_type: boolean
      - name: latitude
        data_type: float64
      - name: longitude
        data_type: float64
      - name: traffic_source
        data_type: string
      - name: acquisition_channel
        data_type: string
      - name: registration_date
        data_type: timestamp
      - name: total_orders
        data_type: int64
      - name: completed_orders
        data_type: int64
      - name: cancelled_orders
        data_type: int64
      - name: lifetime_value
        description: "Total customer spending"
        data_type: float64
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension with sales performance metrics"
    config:
      contract:
        enforced: true
    columns:
      - name: product_id
        description: "Unique product identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name"
        data_type: string
        tests:
          - not_null
      - name: category
        data_type: string
      - name: category_group
        data_type: string
      - name: brand
        data_type: string
      - name: brand_tier
        data_type: string
      - name: department
        data_type: string
      - name: sku
        data_type: string
      - name: product_cost
        data_type: float64
      - name: retail_price
        data_type: float64
      - name: margin_amount
        data_type: float64
      - name: margin_percentage
        data_type: float64
      - name: margin_tier
        data_type: string
      - name: price_category
        data_type: string
      - name: distribution_center_id
        data_type: int64
      - name: total_units_sold
        data_type: int64
      - name: total_orders
        data_type: int64
      - name: unique_customers
        data_type: int64
      - name: total_revenue
        data_type: float64
      - name: total_gross_profit
        data_type: float64
      - name: avg_selling_price
        data_type: float64
      - name: avg_gross_margin_pct
        data_type: float64
      - name: units_returned
        data_type: int64
      - name: total_returned_revenue
        data_type: float64
      - name: return_rate
        data_type: float64
      - name: first_sale_date
        data_type: timestamp
      - name: last_sale_date
        data_type: timestamp
      - name: active_sales_days
        data_type: int64

  - name: fct_orders
    description: "Order fact table with comprehensive metrics"
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        description: "Unique order identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Customer reference"
        data_type: int64
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
              config:
                severity: warn
      - name: order_date
        data_type: timestamp
      - name: order_status
        data_type: string
      - name: customer_gender
        data_type: string
      - name: order_time_of_day
        data_type: string
      - name: order_day_name
        data_type: string
      - name: order_hour
        data_type: int64
      - name: order_month
        data_type: int64
      - name: order_quarter
        data_type: int64
      - name: order_year
        data_type: int64
      - name: is_weekend
        data_type: boolean
      - name: item_count
        data_type: int64
      - name: order_has_returns
        data_type: boolean
      - name: is_delivered
        data_type: boolean
      - name: is_complete
        data_type: boolean
      - name: delivery_days
        data_type: int64
      - name: order_total
        data_type: float64
      - name: total_gross_profit
        data_type: float64
      - name: avg_gross_margin_pct
        data_type: float64
      - name: returned_amount
        data_type: float64
      - name: net_order_total
        data_type: float64
      - name: unique_products
        data_type: int64
      - name: unique_categories
        data_type: int64
      - name: unique_brands
        data_type: int64
      - name: total_line_items
        data_type: int64
      - name: avg_item_price
        data_type: float64
      - name: max_item_price
        data_type: float64
      - name: min_item_price
        data_type: float64
      - name: customer_age
        data_type: int64
      - name: customer_age_group
        data_type: string
      - name: customer_generation
        data_type: string
      - name: customer_state
        data_type: string
      - name: customer_country
        data_type: string
      - name: customer_region
        data_type: string
      - name: is_domestic_customer
        data_type: boolean
      - name: customer_acquisition_channel
        data_type: string

  - name: fct_daily_revenue
    description: "Daily revenue aggregations"
    columns:
      - name: revenue_date
        description: "Date of revenue"
        tests:
          - unique
          - not_null

  - name: rpt_product_performance
    description: "Product performance report"
    columns:
      - name: product_id
        description: "Product reference"
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
              config:
                severity: warn

  - name: rpt_customer_cohorts
    description: "Customer cohort analysis"
    columns:
      - name: cohort_month
        description: "Cohort month"
        tests:
          - not_null

  - name: rpt_executive_dashboard
    description: "Executive dashboard metrics"
    columns:
      - name: metric_month
        description: "Metric month"
        tests:
          - not_null
