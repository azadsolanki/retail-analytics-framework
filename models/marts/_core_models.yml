version: 2

models:
  - name: dim_users
    description: "Customer dimension with comprehensive behavioral and demographic attributes"
    config:
      contract:
        enforced: false # TODO: Enable after defining all columns
    columns:
      - name: user_id
        description: "Unique customer identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address"
        data_type: string
        tests:
          - unique:
              config:
                severity: warn
      - name: lifetime_value
        description: "Total customer spending"
        data_type: float64
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension with sales performance metrics"
    config:
      contract:
        enforced: false # TODO: Enable after defining all columns
    columns:
      - name: product_id
        description: "Unique product identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name"
        data_type: string
        tests:
          - not_null

  - name: fct_orders
    description: "Order fact table with comprehensive metrics"
    config:
      contract:
        enforced: false # TODO: Enable after defining all columns
    columns:
      - name: order_id
        description: "Unique order identifier"
        data_type: int64
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Customer reference"
        data_type: int64
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
              config:
                severity: warn

  - name: fct_daily_revenue
    description: "Daily revenue aggregations"
    columns:
      - name: revenue_date
        description: "Date of revenue"
        tests:
          - unique
          - not_null

  - name: rpt_product_performance
    description: "Product performance report"
    columns:
      - name: product_id
        description: "Product reference"
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
              config:
                severity: warn

  - name: rpt_customer_cohorts
    description: "Customer cohort analysis"
    columns:
      - name: cohort_month
        description: "Cohort month"
        tests:
          - not_null

  - name: rpt_executive_dashboard
    description: "Executive dashboard metrics"
    columns:
      - name: metric_month
        description: "Metric month"
        tests:
          - not_null
