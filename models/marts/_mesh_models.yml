# Marts Models - Mesh Ready
# Public models with contracts, versioning, and group ownership

version: 2

models:
  # ============================================================
  # dim_users - Public Customer Dimension
  # ============================================================
  - name: dim_users
    description: "Customer dimension with demographics, behavior, and segmentation"
    access: public  # Exposed to other projects
    group: analytics_engineering
    latest_version: 1
    config:
      contract:
        enforced: true

    versions:
      - v: 1
        description: "Initial version with full customer attributes"

    columns:
      - name: user_id
        description: "Primary key - unique customer identifier"
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null

      - name: email
        description: "Customer email address"
        data_type: string

      - name: first_name
        description: "Customer first name"
        data_type: string

      - name: last_name
        description: "Customer last name"
        data_type: string

      - name: age
        description: "Customer age in years"
        data_type: int64

      - name: gender
        description: "Customer gender"
        data_type: string

      - name: country
        description: "Customer country"
        data_type: string

      - name: city
        description: "Customer city"
        data_type: string

      - name: traffic_source
        description: "Acquisition channel"
        data_type: string

      - name: created_at
        description: "Account creation timestamp"
        data_type: timestamp

      - name: lifetime_value
        description: "Total customer spend"
        data_type: float64

      - name: total_orders
        description: "Number of orders placed"
        data_type: int64

      - name: customer_segment
        description: "Value-based segment (VIP, Loyal, Regular, New)"
        data_type: string

  # ============================================================
  # dim_products - Public Product Dimension
  # ============================================================
  - name: dim_products
    description: "Product dimension with catalog, pricing, and performance metrics"
    access: public
    group: analytics_engineering
    latest_version: 1
    config:
      contract:
        enforced: true

    versions:
      - v: 1
        description: "Initial version with product attributes and metrics"

    columns:
      - name: product_id
        description: "Primary key - unique product identifier"
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null

      - name: product_name
        description: "Product display name"
        data_type: string

      - name: category
        description: "Product category"
        data_type: string

      - name: brand
        description: "Product brand"
        data_type: string

      - name: department
        description: "Product department"
        data_type: string

      - name: retail_price
        description: "Current retail price"
        data_type: float64

      - name: cost
        description: "Product cost"
        data_type: float64

      - name: margin_percentage
        description: "Profit margin as percentage"
        data_type: float64

      - name: performance_tier
        description: "Product performance classification"
        data_type: string

  # ============================================================
  # fct_orders - Public Orders Fact
  # ============================================================
  - name: fct_orders
    description: "Order transactions with customer journey and financial metrics"
    access: public
    group: analytics_engineering
    latest_version: 1
    config:
      contract:
        enforced: true
      materialized: incremental
      unique_key: order_id
      on_schema_change: append_new_columns

    versions:
      - v: 1
        description: "Initial version with order metrics"

    columns:
      - name: order_id
        description: "Primary key - unique order identifier"
        data_type: string
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - unique
          - not_null

      - name: user_id
        description: "Foreign key to dim_users"
        data_type: string
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
              config:
                severity: warn

      - name: order_date
        description: "Order placement timestamp"
        data_type: timestamp

      - name: order_status
        description: "Current order status"
        data_type: string

      - name: order_total
        description: "Total order value"
        data_type: float64

      - name: total_gross_profit
        description: "Order gross profit"
        data_type: float64

      - name: is_first_order
        description: "First order indicator"
        data_type: boolean

  # ============================================================
  # fct_daily_revenue - Public Daily Metrics
  # ============================================================
  - name: fct_daily_revenue
    description: "Daily aggregated revenue metrics for reporting"
    access: public
    group: analytics_engineering
    latest_version: 1
    config:
      materialized: incremental
      unique_key: revenue_date

    versions:
      - v: 1
        description: "Initial version with daily revenue aggregations"

    columns:
      - name: revenue_date
        description: "Date of revenue"
        data_type: date
        tests:
          - unique
          - not_null

      - name: total_revenue
        description: "Total daily revenue"
        data_type: float64

      - name: total_orders
        description: "Number of orders"
        data_type: int64

      - name: unique_customers
        description: "Distinct customers"
        data_type: int64
