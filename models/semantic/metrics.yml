# Metrics Definitions
# Business metrics built on top of semantic models
# These are the "single source of truth" for key business KPIs

metrics:
  # =============================================================
  # Revenue Metrics
  # =============================================================
  - name: revenue
    description: Total revenue from all orders
    type: simple
    label: Revenue
    type_params:
      measure: total_revenue

  - name: completed_revenue
    description: Total revenue from completed orders only
    type: simple
    label: Completed Revenue
    type_params:
      measure: total_revenue
    filter: |
      {{ Dimension('order__order_status') }} = 'Complete'

  - name: net_revenue
    description: Net revenue excluding returns
    type: simple
    label: Net Revenue
    type_params:
      measure: net_revenue

  - name: gross_profit
    description: Total gross profit
    type: simple
    label: Gross Profit
    type_params:
      measure: total_gross_profit

  - name: gross_margin
    description: Gross profit as percentage of revenue
    type: derived
    label: Gross Margin %
    type_params:
      expr: gross_profit / nullif(revenue, 0) * 100
      metrics:
        - name: gross_profit
        - name: revenue

  - name: aov
    description: Average order value
    type: simple
    label: Average Order Value
    type_params:
      measure: average_order_value

  - name: returns
    description: Total value of returned items
    type: simple
    label: Returns
    type_params:
      measure: returned_amount

  - name: return_rate
    description: Return amount as percentage of revenue
    type: derived
    label: Return Rate %
    type_params:
      expr: returns / nullif(revenue, 0) * 100
      metrics:
        - name: returns
        - name: revenue

  # =============================================================
  # Order Metrics
  # =============================================================
  - name: orders
    description: Total number of orders
    type: simple
    label: Orders
    type_params:
      measure: order_count

  - name: completed_orders
    description: Number of completed orders
    type: simple
    label: Completed Orders
    type_params:
      measure: order_count
    filter: |
      {{ Dimension('order__order_status') }} = 'Complete'

  - name: items_sold
    description: Total line items sold
    type: simple
    label: Items Sold
    type_params:
      measure: total_items_sold

  # =============================================================
  # Customer Metrics
  # =============================================================
  - name: customers
    description: Total number of customers
    type: simple
    label: Customers
    type_params:
      measure: customer_count

  - name: active_customers
    description: Unique customers who placed orders
    type: simple
    label: Active Customers
    type_params:
      measure: unique_customers

  - name: customer_ltv
    description: Average customer lifetime value
    type: simple
    label: Customer LTV
    type_params:
      measure: average_lifetime_value

  # =============================================================
  # Customer Segment Metrics
  # =============================================================
  - name: total_ltv
    description: Total lifetime value across all customers
    type: simple
    label: Total LTV
    type_params:
      measure: total_lifetime_value

  # =============================================================
  # Product Metrics
  # =============================================================
  - name: product_revenue
    description: Total revenue from products
    type: simple
    label: Product Revenue
    type_params:
      measure: total_product_revenue

  - name: product_profit
    description: Total profit from products
    type: simple
    label: Product Profit
    type_params:
      measure: total_product_profit

  - name: units_sold
    description: Total units sold
    type: simple
    label: Units Sold
    type_params:
      measure: total_units_sold

  - name: units_returned
    description: Total units returned
    type: simple
    label: Units Returned
    type_params:
      measure: total_units_returned

  - name: product_return_rate
    description: Average product return rate
    type: simple
    label: Product Return Rate %
    type_params:
      measure: average_return_rate
