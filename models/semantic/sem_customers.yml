# Semantic Model: Customers (Users)
# Defines the customer dimension for MetricFlow
# Enables customer-centric metrics and segmentation analysis

semantic_models:
  - name: customers
    description: |
      Customer dimension with segmentation, lifetime value, and order history.
      Grain: one row per customer.
    model: ref('dim_users')

    entities:
      - name: customer
        type: primary
        expr: user_id

    measures:
      - name: customer_count
        description: Total number of customers
        agg: count
        expr: user_id

      - name: total_lifetime_value
        description: Sum of customer lifetime values
        agg: sum
        expr: lifetime_value

      - name: average_lifetime_value
        description: Average customer lifetime value
        agg: average
        expr: lifetime_value

      - name: total_customer_orders
        description: Sum of total orders across customers
        agg: sum
        expr: total_orders

    dimensions:
      - name: age_group
        type: categorical
        expr: age_group

      - name: generation
        type: categorical
        expr: generation

      - name: gender
        type: categorical
        expr: gender

      - name: country
        type: categorical
        expr: country

      - name: region
        type: categorical
        expr: region

      - name: traffic_source
        type: categorical
        expr: traffic_source

      - name: acquisition_channel
        type: categorical
        expr: acquisition_channel

      - name: is_domestic
        type: categorical
        expr: is_domestic

      - name: registration_date
        type: time
        type_params:
          time_granularity: day
        expr: registration_date
