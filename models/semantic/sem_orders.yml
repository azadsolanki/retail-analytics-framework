# Semantic Model: Orders
# Defines the orders fact table for MetricFlow
# This enables consistent metric definitions across all BI tools and AI agents

semantic_models:
  - name: orders
    description: |
      Order transactions with revenue, profit, and customer metrics.
      Grain: one row per order.
    model: ref('fct_orders')
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order
        type: primary
        expr: order_id
      - name: customer
        type: foreign
        expr: user_id

    measures:
      - name: order_count
        description: Total number of orders
        agg: count
        expr: order_id

      - name: total_revenue
        description: Total order revenue
        agg: sum
        expr: order_total

      - name: net_revenue
        description: Net revenue (excluding returns)
        agg: sum
        expr: net_order_total

      - name: total_gross_profit
        description: Total gross profit across orders
        agg: sum
        expr: total_gross_profit

      - name: returned_amount
        description: Total amount from returned items
        agg: sum
        expr: returned_amount

      - name: average_order_value
        description: Average order value
        agg: average
        expr: order_total

      - name: total_items_sold
        description: Total line items sold
        agg: sum
        expr: total_line_items

      - name: unique_customers
        description: Count of unique customers
        agg: count_distinct
        expr: user_id

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
        expr: order_date

      - name: order_status
        type: categorical
        expr: order_status

      - name: order_time_of_day
        type: categorical
        expr: order_time_of_day

      - name: order_day_name
        type: categorical
        expr: order_day_name

      - name: is_weekend
        type: categorical
        expr: is_weekend

      - name: customer_gender
        type: categorical
        expr: customer_gender

      - name: customer_age_group
        type: categorical
        expr: customer_age_group

      - name: customer_generation
        type: categorical
        expr: customer_generation

      - name: customer_country
        type: categorical
        expr: customer_country

      - name: customer_region
        type: categorical
        expr: customer_region

      - name: is_domestic_customer
        type: categorical
        expr: is_domestic_customer
