# Semantic Model: Products
# Defines the product dimension for MetricFlow
# Enables product performance and margin analysis

semantic_models:
  - name: products
    description: |
      Product dimension with categories, brands, and performance metrics.
      Grain: one row per product.
    model: ref('dim_products')
    defaults:
      agg_time_dimension: first_sale_date

    entities:
      - name: product
        type: primary
        expr: product_id

    measures:
      - name: product_count
        description: Total number of products
        agg: count
        expr: product_id
        agg_time_dimension: first_sale_date

      - name: total_product_revenue
        description: Total revenue from all products
        agg: sum
        expr: total_revenue
        agg_time_dimension: first_sale_date

      - name: total_product_profit
        description: Total gross profit from all products
        agg: sum
        expr: total_gross_profit
        agg_time_dimension: first_sale_date

      - name: total_units_sold
        description: Total units sold across all products
        agg: sum
        expr: total_units_sold
        agg_time_dimension: first_sale_date

      - name: total_units_returned
        description: Total units returned
        agg: sum
        expr: units_returned
        agg_time_dimension: first_sale_date

      - name: average_margin
        description: Average product margin percentage
        agg: average
        expr: margin_percentage
        agg_time_dimension: first_sale_date

      - name: average_return_rate
        description: Average product return rate
        agg: average
        expr: return_rate
        agg_time_dimension: first_sale_date

    dimensions:
      - name: first_sale_date
        type: time
        type_params:
          time_granularity: day
        expr: first_sale_date

      - name: category
        type: categorical
        expr: category

      - name: category_group
        type: categorical
        expr: category_group

      - name: brand
        type: categorical
        expr: brand

      - name: brand_tier
        type: categorical
        expr: brand_tier

      - name: department
        type: categorical
        expr: department

      - name: margin_tier
        type: categorical
        expr: margin_tier

      - name: price_category
        type: categorical
        expr: price_category

      - name: product_name
        type: categorical
        expr: product_name
