# dbt CI/CD Pipeline with Multi-Environment Support
#
# Environments:
#   - ci:   Ephemeral PR datasets (dbt_ci_pr_XX)
#   - qa:   Pre-production testing (dbt_qa)
#   - prod: Production (dbt_prod)
#
# Workflow:
#   - PRs:           compile -> slim build (ci) -> docs
#   - Merge to main: compile -> full build (prod) -> save manifest -> ERD
#   - Manual:        deploy to QA or Prod on demand

# dbt CI/CD Pipeline
# Uses composite action to reduce repetition

name: dbt CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "qa"
        type: choice
        options: [qa, prod]
      models:
        description: "Model selector (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write

env:
  DBT_PROJECT: data-products-441119
  DBT_PROFILE: thelook_analytics
  GCS_MANIFEST_BUCKET: gs://data-products-441119-dbt-artifacts/manifests

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dbt
        uses: ./.github/actions/setup-dbt
        with:
          gcp_credentials: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          target: ci
          dataset: dbt_ci
          project: ${{ env.DBT_PROJECT }}
          profile: ${{ env.DBT_PROFILE }}

      - name: Lint SQL
        run: |
          pip install sqlfluff sqlfluff-templater-dbt
          sqlfluff lint models/ --dialect bigquery --ignore parsing || true

      - name: Compile
        run: dbt compile

      - name: Validate Airflow DAGs
        run: python -m py_compile airflow/dags/*.py

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: compile
    if: github.event_name != 'workflow_dispatch'
    env:
      DBT_DATASET: ${{ github.event_name == 'pull_request' && format('dbt_ci_pr_{0}', github.event.pull_request.number) || 'dbt_prod' }}
      DBT_TARGET: ${{ github.event_name == 'pull_request' && 'ci' || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup dbt
        uses: ./.github/actions/setup-dbt
        with:
          gcp_credentials: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          target: ${{ env.DBT_TARGET }}
          dataset: ${{ env.DBT_DATASET }}
          project: ${{ env.DBT_PROJECT }}
          profile: ${{ env.DBT_PROFILE }}
          setup_gcloud: "true"

      - name: Download manifest (Slim CI)
        id: manifest
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p ./prod-manifest
          if gsutil cp ${{ env.GCS_MANIFEST_BUCKET }}/prod/manifest.json ./prod-manifest/manifest.json 2>/dev/null; then
            echo "manifest_exists=true" >> $GITHUB_OUTPUT
          else
            echo "manifest_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build (Slim CI)
        if: github.event_name == 'pull_request' && steps.manifest.outputs.manifest_exists == 'true'
        run: dbt build --select +state:modified+ --state ./prod-manifest --exclude snap_products

      - name: Build (Full)
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && steps.manifest.outputs.manifest_exists != 'true')
        run: dbt build --exclude snap_products

      - name: Upload manifest
        if: github.ref == 'refs/heads/main'
        run: |
          gsutil cp target/manifest.json ${{ env.GCS_MANIFEST_BUCKET }}/prod/manifest.json
          gsutil cp target/manifest.json ${{ env.GCS_MANIFEST_BUCKET }}/prod/backups/manifest_$(date +%Y%m%d_%H%M%S).json

      - name: Cleanup CI dataset
        if: always() && github.event_name == 'pull_request'
        run: bq rm -r -f ${{ env.DBT_PROJECT }}:${{ env.DBT_DATASET }} || true

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: compile
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}
    env:
      DBT_DATASET: ${{ github.event.inputs.environment == 'prod' && 'dbt_prod' || 'dbt_qa' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup dbt
        uses: ./.github/actions/setup-dbt
        with:
          gcp_credentials: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          target: ${{ github.event.inputs.environment }}
          dataset: ${{ env.DBT_DATASET }}
          project: ${{ env.DBT_PROJECT }}
          profile: ${{ env.DBT_PROFILE }}
          setup_gcloud: "true"

      - name: Deploy
        run: |
          if [ -n "${{ github.event.inputs.models }}" ]; then
            dbt build --select ${{ github.event.inputs.models }} --exclude snap_products
          else
            dbt build --exclude snap_products
          fi

      - name: Upload manifest
        if: github.event.inputs.environment == 'prod'
        run: |
          gsutil cp target/manifest.json ${{ env.GCS_MANIFEST_BUCKET }}/prod/manifest.json
          gsutil cp target/manifest.json ${{ env.GCS_MANIFEST_BUCKET }}/prod/backups/manifest_$(date +%Y%m%d_%H%M%S).json

  erd:
    name: Generate ERD
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup dbt
        uses: ./.github/actions/setup-dbt
        with:
          gcp_credentials: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          target: prod
          dataset: dbt_prod
          project: ${{ env.DBT_PROJECT }}
          profile: ${{ env.DBT_PROFILE }}

      - name: Generate docs and ERD
        run: |
          dbt docs generate
          pip install dbterd
          mkdir -p docs
          dbterd run -ad target -o docs -t mermaid \
            -s "model.digital_marketing.dim_" \
            -s "model.digital_marketing.fct_" \
            -s "model.digital_marketing.rpt_" \
            --exclude "model.elementary"
          echo -e "# Data Model ERD\n\nAuto-generated from dbt relationship tests.\n\n\`\`\`mermaid" > docs/erd.md
          cat docs/output.md >> docs/erd.md
          echo '```' >> docs/erd.md
          rm docs/output.md

      - name: Commit ERD
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/erd.md
          git commit -m "Update ERD [skip ci]" || true
          git push
